<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการออเดอร์ & จ่าหน้าพัสดุ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-header no-print">
      <h1>📦 ระบบหยิบสินค้าและแพ็คพัสดุ</h1>
      <div>
        <button onclick="loadOrders()" class="btn-refresh">🔄 รีเฟรชข้อมูล</button>
        <a href="index.html" class="btn-back">กลับหน้าร้าน</a>
      </div>
    </div>

    <div id="orderList" class="order-list no-print">
      <p>กำลังโหลดข้อมูลคำสั่งซื้อจาก Google Sheets...</p>
    </div>

    <!-- พื้นที่สำหรับพิมพ์ใบจ่าหน้าพัสดุ (จะแสดงเฉพาะตอนกดพิมพ์) -->
    <div id="printArea" class="print-label"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // โหลดข้อมูลออเดอร์ทันทีเมื่อเปิดหน้า admin
    window.onload = loadOrders;
  </script>
</body>
</html>
